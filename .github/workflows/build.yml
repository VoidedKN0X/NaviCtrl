name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore (if configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with release key"
          else
            echo "::warning::No KEYSTORE_BASE64 secret set - APK is signed with a debug key. Add the release key secrets to sign properly."
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ vars.KEY_ALIAS || secrets.KEY_ALIAS }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          # Surface compiler and Gradle errors as annotations so they show on the run page and in the API.
          grep -E '^e: |^ERROR:|error: |What went wrong' -A 3 build.log | head -60 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Rename APKs
        run: |
          mkdir -p out
          for f in app/build/outputs/apk/release/*.apk; do
            cp "$f" "out/NaviCtrl-v0.1.${{ github.run_number }}.apk"
          done
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: NaviCtrl-v0.1.${{ github.run_number }}
          path: out/*.apk

      - name: Publish release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: NaviCtrl v0.1.${{ github.run_number }}
          files: out/*.apk
          generate_release_notes: true
